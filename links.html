<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsDesk — リンク</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:#12131A;
    color:#ECE9E2;
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }

  .wrap{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  /* Logo area */
  .logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }

  .logo-icon{
    width:72px;height:72px;
    background:#1A1C26;
    border:1px solid #2A2D3A;
    border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }

  .logo-name{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.3px;
  }
  .logo-name span{color:#45D6B0;}

  .beta-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:1.5px;
    color:#45D6B0;
    background:rgba(69,214,176,.1);
    border:1px solid rgba(69,214,176,.25);
    border-radius:20px;
    padding:3px 10px;
  }

  .tagline{
    font-size:13px;
    color:#8C8FA3;
    text-align:center;
    line-height:1.6;
    margin-top:4px;
  }

  /* Link buttons */
  .link-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    background:#1A1C26;
    border:1px solid #2A2D3A;
    border-radius:14px;
    text-decoration:none;
    color:#ECE9E2;
    font-size:14px;
    font-weight:500;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .link-btn:hover{
    background:#20222E;
    border-color:#3A3D4A;
    transform:translateY(-1px);
  }
  .link-btn:active{transform:translateY(0);}

  .link-btn.primary{
    background:rgba(69,214,176,.1);
    border-color:rgba(69,214,176,.3);
  }
  .link-btn.primary:hover{
    background:rgba(69,214,176,.15);
    border-color:rgba(69,214,176,.5);
  }

  .link-btn.discord{
    background:rgba(88,101,242,.1);
    border-color:rgba(88,101,242,.3);
  }
  .link-btn.discord:hover{
    background:rgba(88,101,242,.15);
    border-color:rgba(88,101,242,.5);
  }

  .btn-icon{
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .btn-icon.green{background:rgba(69,214,176,.15);}
  .btn-icon.blue{background:rgba(91,157,239,.15);}
  .btn-icon.discord-bg{background:rgba(88,101,242,.15);}

  .btn-text{
    display:flex;flex-direction:column;gap:2px;
  }
  .btn-label{font-size:14px;font-weight:600;}
  .btn-sub{font-size:11px;color:#8C8FA3;}

  .btn-arrow{
    margin-left:auto;
    color:#3A3D4A;
    font-size:16px;
  }

  /* Beta badge strip */
  .beta-strip{
    width:100%;
    background:rgba(255,107,91,.07);
    border:1px solid rgba(255,107,91,.2);
    border-radius:12px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:#ECE9E2;
    line-height:1.5;
  }
  .beta-strip .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:#FF6B5B;
    flex-shrink:0;
  }

  .footer{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#3A3D4A;
    letter-spacing:.5px;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="14" height="10" rx="3" fill="#45D6B0" opacity=".9"/>
        <rect x="22" y="4" width="14" height="10" rx="3" fill="#2A2D3A"/>
        <rect x="4" y="18" width="32" height="4" rx="2" fill="#2A2D3A"/>
        <rect x="4" y="18" width="20" height="4" rx="2" fill="#45D6B0" opacity=".6"/>
        <rect x="4" y="26" width="32" height="4" rx="2" fill="#2A2D3A"/>
        <rect x="4" y="26" width="12" height="4" rx="2" fill="#45D6B0" opacity=".35"/>
        <circle cx="29" cy="9" r="3.5" fill="#FF6B5B"/>
      </svg>
    </div>
    <div class="logo-name">Ops<span>Desk</span></div>

  <!-- β strip -->
  <div class="beta-strip">
    <div class="dot"></div>
    <span>9月末までにプロプランを契約で、契約月から3ヶ月間¥680/月</span>
  </div>

  <!-- App link -->
  <a class="link-btn primary" href="https://opsdesk.ringnote.jp/app" target="_blank" rel="noopener">
    <div class="btn-icon green">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#45D6B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
    </div>
    <div class="btn-text">
      <span class="btn-label">アプリを使う</span>
      <span class="btn-sub">無料で登録できます</span>
    </div>
    <span class="btn-arrow">›</span>
  </a>

  <!-- LP link -->
  <a class="link-btn" href="https://lp.opsdesk.ringnote.jp" target="_blank" rel="noopener">
    <div class="btn-icon blue">

        <circle cx="12" cy="12" r="10"/>

      </svg>
    </div>
    <div class="btn-text">
      <span class="btn-label">機能・料金を見る</span>
      <span class="btn-sub">OpsDesk 公式サイト</span>
    </div>
    <span class="btn-arrow">›</span>
  </a>

  <!-- Discord link -->
  <a class="link-btn discord" href="https://discord.gg/3UhzjsHF4a" target="_blank" rel="noopener">
    <div class="btn-icon discord-bg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    </div>
    <div class="btn-text">
      <span class="btn-label">Discordコミュニティ</span>
      <span class="btn-sub">バグ報告・フィードバックはこちら</span>
    </div>
    <span class="btn-arrow">›</span>
  </a>

  <!-- X link -->
  <a class="link-btn" href="https://x.com/OpsDesk_Officia" target="_blank" rel="noopener">
    <div class="btn-icon" style="background:rgba(255,255,255,.06);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#ECE9E2"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </div>
    <div class="btn-text">
      <span class="btn-label">X（旧Twitter）</span>
      <span class="btn-sub">@OpsDesk_Officia</span>
    </div>
    <span class="btn-arrow">›</span>
  </a>

  <p class="footer">© 2026 OpsDesk</p>
</div>
</body>
</html>
